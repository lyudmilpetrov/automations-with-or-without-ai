<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(() => {
        const redirect = window.location.search.match(/[?&]p=([^&]+)/)

        if (!redirect) {
          return
        }

        const decodedPath = decodeURIComponent(redirect[1]).replace(/~and~/g, '&')
        const queryWithoutRedirect = window.location.search
          .replace(/([?&])p=[^&]*&?/, '$1')
          .replace(/[?&]$/, '')
        const hash = window.location.hash || ''
        const restoredUrl = `${window.location.origin}${decodedPath}${queryWithoutRedirect}${hash}`

        window.history.replaceState(null, '', restoredUrl)
      })()
    </script>
