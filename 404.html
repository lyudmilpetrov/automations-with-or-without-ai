<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Automation</title>
    <script>
      ;(() => {
        const { pathname, search, hash } = window.location
        const redirectTarget = `${pathname}${search}${hash}`.replace(/&/g, '~and~')
        const basePath = '/automations-with-or-without-ai/'
        const redirectUrl = `${window.location.origin}${basePath}?p=${encodeURIComponent(redirectTarget)}`

        window.location.replace(redirectUrl)
      })()
    </script>
  </head>
  <body></body>
</html>
